name: Wolf
description: >-
  Wolf (fromwolf.com) is a white-label, multi-tenant staffing and gig-work
  platform that lets staffing companies run their own branded on-demand
  workforce. Its API coordinates job seekers, clients, campaigns (client
  orders), shifts, tenders (a seeker's request to work a shift), applications,
  timesheets, availability, notifications, and in-app chat — everything needed
  to build a client- or worker-facing staffing interface on top of the Wolf
  backend. Each tenant runs on its own database and authenticates with a tenant
  key plus a platform API key or per-user authentication token. Wolf was
  surfaced as a Techstars portfolio company and profiled by the API Evangelist
  network.
